services:
  - type: web
    name: campuspulse-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "false"
  - type: web
    name: campuspulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: python build.py
    staticPublishPath: .
    envVars:
      - key: API_BASE_URL
        value: https://campuspulse-backend.onrender.com
